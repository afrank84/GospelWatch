name: Collect Persecution News

on:
  schedule:
    # Every hour
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gospelwatch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-${{
            hashFiles('requirements.txt')
            }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Web Data Directories
        run: |
          mkdir -p web/data
          mkdir -p web/data/history

      - name: Run Collector
        run: |
          python scripts/collect.py

      - name: Generate Map Data
        run: |
          python scripts/generate_map.py

      - name: Validate JSON Files
        run: |
          python -m json.tool web/data/incidents.json > /dev/null
          python -m json.tool web/data/map.json > /dev/null

      - name: Show Generated Files
        run: |
          ls -R web/data

      - name: Commit Updated Data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add web/data

          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Automatically updated via GitHub Action $(date -u +'%Y-%m-%d')"

          git pull --rebase origin main

          git push